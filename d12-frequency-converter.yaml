# Version 1.2
substitutions:
  device_name: d12-frequency-converter
  friendly_name: "D12 Frequency Converter"
  modbus_address: "1"  # Change to match your device address (P6.00)

esphome:
  name: ${device_name}

# Double-mode PAC (économie) / Arrosage (PID) avec détection hydraulique auto.
# Voir dual-mode-control.yaml. Commenter cette ligne pour désactiver.
packages:
  dual_mode: !include dual-mode-control.yaml

esp8266:
  board: d1_mini

# Enable logging
logger:
  level: DEBUG  # TEMP diagnostic: keep raw UART frames without API VERY_VERBOSE noise
  baud_rate: 0  # Disable UART logging to avoid conflicts with Modbus

# Enable Home Assistant API
api:
#  encryption:
#    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Enable fallback hotspot
  ap:
    ssid: "${device_name} Fallback"
    password: !secret ap_password

captive_portal:

# Configure UART for RS485
uart:
  id: mod_bus
  tx_pin: GPIO1  # TX (borne TX du Wemos)
  rx_pin: GPIO3  # RX (borne RX du Wemos)
  baud_rate: 9600  # ZT-D12-220V supports 9600 ONLY (P6.01 ones digit: 0=9600, 1/2 reserved). Set D12 P6.01=0000.
  stop_bits: 1  # D12 manual RTU frame: 8 data bits, no parity, 1 stop bit
  parity: NONE
  debug:           # TEMP diagnostic: log raw TX/RX bytes
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 50ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ':');
  # Auto-direction RS485 module (3.3 V), TTL header crossed:
  # - module RXD <- GPIO1 (ESP TX)
  # - module TXD -> GPIO3 (ESP RX)
  # - no DE/RE pin (the module handles bus direction)

# Modbus Controller
modbus:
  id: modbus1
  uart_id: mod_bus
  # Auto-direction RS485 module (no DE/RE) → no flow_control_pin needed. GPIO5 is free.

modbus_controller:
  - id: d12_vfd
    address: ${modbus_address}
    modbus_id: modbus1
    setup_priority: -10
    update_interval: 2s
    command_throttle: 50ms  # Add 50ms delay between commands to reduce collisions

# ===== SENSORS (Read-only monitoring) =====
sensor:
  # The D12 manual lists sparse 0x210x status registers. Some units silently ignore
  # grouped reads that cross unsupported gaps, so keep telemetry reads independent.
  # Output Frequency (Hz)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Output Frequency"
    id: output_frequency
    register_type: holding
    address: 0x2103
    force_new_range: true
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Set Frequency (Hz)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Set Frequency"
    id: set_frequency
    register_type: holding
    address: 0x2102
    force_new_range: true
    unit_of_measurement: "Hz"
    device_class: frequency
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Output Current (A)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Output Current"
    id: output_current
    register_type: holding
    address: 0x2104
    force_new_range: true
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Bus Voltage (V)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Bus Voltage"
    id: bus_voltage
    register_type: holding
    address: 0x2105
    force_new_range: true
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0

  # Output Voltage (V)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Output Voltage"
    id: output_voltage
    register_type: holding
    address: 0x2106
    force_new_range: true
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0

  # Module Temperature (°C)
  # Note: Some D12 models may not support this register
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Temperature"
    id: module_temperature
    register_type: holding
    address: 0x210D
    force_new_range: true
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    skip_updates: 10  # Poll less frequently if device doesn't always respond
    filters:
      - multiply: 0.1

  # PID Feedback Value (Raw percentage 0-100%)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "PID Feedback"
    id: pid_feedback
    register_type: holding
    address: 0x210E
    force_new_range: true
    state_class: measurement
    accuracy_decimals: 2
    internal: true  # Hide raw value, use pressure sensor instead
    filters:
      - multiply: 0.01

  # PID Setpoint (Raw percentage 0-100%)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "PID Setpoint"
    id: pid_setpoint
    register_type: holding
    address: 0x210F
    force_new_range: true
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01

  # Raw ACI analog input in mA (ZT-D12-220V manual, register 0x2108).
  # Reads the 4-20mA pressure sensor DIRECTLY — no PID feedback channel (P3.00)
  # and no P2.04-P2.07 scaling needed. Just wire the sensor to ACI/GND and set the
  # board's AI jumper to current (Cin).
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "ACI Input"
    id: aci_input
    register_type: holding
    address: 0x2108
    force_new_range: true
    unit_of_measurement: "mA"
    state_class: measurement
    accuracy_decimals: 2
    internal: true
    filters:
      - multiply: 0.01   # raw value is mA x100 -> mA

  # Pressure from the 4-20mA sensor on ACI (register 0x2108).
  # 4 mA = 0 bar, 20 mA = full scale. Set range_bar to your sensor's span
  # (10.0 for a 0-10 bar / 0-1 MPa sensor).
  - platform: template
    name: "Pressure"
    id: pressure_sensor
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    icon: mdi:gauge
    lambda: |-
      const float range_bar = 10.0;  // pressure at 20 mA — change to your sensor's full scale
      float ma = id(aci_input).state;
      if (isnan(ma)) return NAN;      // D12 offline -> unavailable (not a fake 0)
      float p = (ma - 4.0) / 16.0 * range_bar;
      return p > 0.0 ? p : 0.0;
    update_interval: 2s

  # Pressure Setpoint (converted from PID setpoint)
  - platform: template
    name: "Pressure Setpoint"
    id: pressure_setpoint
    unit_of_measurement: "bar"
    device_class: pressure
    state_class: measurement
    accuracy_decimals: 2
    icon: mdi:gauge-empty
    lambda: |-
      // Convert PID setpoint percentage to pressure
      // Must match the same multiplier as pressure_sensor above
      if (id(pid_setpoint).state >= 0) {
        return id(pid_setpoint).state * 10.0;  // Change 10.0 to your sensor's max pressure
      } else {
        return 0.0;
      }
    update_interval: 2s

  # Status Word (raw for debugging)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Status Word"
    id: status_word
    register_type: holding
    address: 0x2101
    force_new_range: true
    internal: true
    skip_updates: 10

  # Fault code (register 0x2100) — 0 normal, 1 module, 2 overvolt, 3 temp,
  # 4 VFD overload, 5 motor overload, 6 external, 10-12 overcurrent, 14 undervolt
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Fault Code"
    id: fault_code
    register_type: holding
    address: 0x2100
    force_new_range: true
    internal: true
    skip_updates: 5

  # Power Calculation (approximation: V * I * sqrt(3) for 3-phase)
  - platform: template
    name: "Estimated Power"
    id: estimated_power
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      if (isnan(id(output_voltage).state) || isnan(id(output_current).state)) {
        return 0.0;
      }
      return id(output_voltage).state * id(output_current).state * 1.732;
    update_interval: 2s

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

# ===== BINARY SENSORS (Status indicators) =====
binary_sensor:
  # Running Status (BIT0 of status word)
  - platform: template
    name: "Running"
    id: is_running
    device_class: running
    lambda: |-
      return ((int)id(status_word).state & 0x0001) != 0;

  # Stop Status (BIT1)
  - platform: template
    name: "Stopped"
    id: is_stopped
    lambda: |-
      return ((int)id(status_word).state & 0x0002) != 0;

  # Jog Status (BIT2)
  - platform: template
    name: "Jogging"
    id: is_jogging
    lambda: |-
      return ((int)id(status_word).state & 0x0004) != 0;

  # Forward Direction (BIT3)
  - platform: template
    name: "Forward Direction"
    id: is_forward
    lambda: |-
      return ((int)id(status_word).state & 0x0008) != 0;

  # Reverse Direction (BIT4)
  - platform: template
    name: "Reverse Direction"
    id: is_reverse
    lambda: |-
      return ((int)id(status_word).state & 0x0010) != 0;

  # Overload — read from the fault code 0x2100 (4 = VFD overload, 5 = motor overload).
  # NB: status-word Bit10 is "Communication operation command", NOT overload (ZT-D12 manual).
  - platform: template
    name: "Overload"
    id: overload_warning
    device_class: problem
    lambda: |-
      int f = (int)id(fault_code).state;
      return (f == 4 || f == 5);

  # Any active fault (0x2100 != 0)
  - platform: template
    name: "Fault"
    device_class: problem
    lambda: |-
      if (isnan(id(fault_code).state)) return false;
      return ((int)id(fault_code).state) != 0;

  # Status
  - platform: status
    name: "Status"

# ===== NUMBERS (Control inputs) =====
number:
  # Frequency Setpoint Control (-100.00% to 100.00% of max frequency)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Frequency Setpoint"
    id: frequency_setpoint
    register_type: holding
    address: 0x2001
    min_value: -100
    max_value: 100
    step: 0.1
    unit_of_measurement: "%"
    mode: slider
    multiply: 100
    use_write_multiple: false

# ===== SWITCHES (Control commands) =====
switch:
  # Forward Run
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Run Forward"
    id: run_forward
    register_type: holding
    address: 0x2000
    icon: mdi:play
    use_write_multiple: false
    skip_updates: 999  # Write-only, don't poll for status
    # 0x0012 = Forward, 0x0001 = Stop
    write_lambda: |-
      if (x) {
        return 0x0012;
      } else {
        return 0x0001;
      }

  # Reverse Run
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Run Reverse"
    id: run_reverse
    register_type: holding
    address: 0x2000
    icon: mdi:play-reverse
    use_write_multiple: false
    skip_updates: 999  # Write-only, don't poll for status
    # 0x0022 = Reverse, 0x0001 = Stop
    write_lambda: |-
      if (x) {
        return 0x0022;
      } else {
        return 0x0001;
      }

  # Stop Command (helper switch)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Stop Switch"
    id: vfd_stop_switch
    internal: true
    register_type: holding
    address: 0x2000
    use_write_multiple: false
    skip_updates: 999  # Write-only, don't poll for status
    # 0x0001 = Stop
    write_lambda: |-
      return 0x0001;

  # Forward Jog (helper switch)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Jog Forward Switch"
    id: vfd_jog_forward_switch
    internal: true
    register_type: holding
    address: 0x2000
    use_write_multiple: false
    skip_updates: 999  # Write-only, don't poll for status
    # 0x0013 = Forward Jog
    write_lambda: |-
      return 0x0013;

  # Reverse Jog (helper switch)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Jog Reverse Switch"
    id: vfd_jog_reverse_switch
    internal: true
    register_type: holding
    address: 0x2000
    use_write_multiple: false
    skip_updates: 999  # Write-only, don't poll for status
    # 0x0023 = Reverse Jog
    write_lambda: |-
      return 0x0023;

  # Fault Reset (helper switch)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Fault Reset Switch"
    id: vfd_fault_reset_switch
    internal: true
    register_type: holding
    address: 0x2002
    use_write_multiple: false
    skip_updates: 999  # Write-only, don't poll for status
    # 0x0002 = Fault Reset
    write_lambda: |-
      return 0x0002;

# ===== BUTTONS (Single-action commands) =====
button:
  # Stop Command
  - platform: template
    name: "Stop"
    icon: mdi:stop
    on_press:
      then:
        - switch.turn_on: vfd_stop_switch
        - delay: 50ms
        - switch.turn_off: vfd_stop_switch

  # Forward Jog
  - platform: template
    name: "Jog Forward"
    icon: mdi:debug-step-over
    on_press:
      then:
        - switch.turn_on: vfd_jog_forward_switch
        - delay: 50ms
        - switch.turn_off: vfd_jog_forward_switch

  # Reverse Jog
  - platform: template
    name: "Jog Reverse"
    icon: mdi:debug-step-into
    on_press:
      then:
        - switch.turn_on: vfd_jog_reverse_switch
        - delay: 50ms
        - switch.turn_off: vfd_jog_reverse_switch

  # Fault Reset
  - platform: template
    name: "Fault Reset"
    icon: mdi:restore-alert
    on_press:
      then:
        - switch.turn_on: vfd_fault_reset_switch
        - delay: 50ms
        - switch.turn_off: vfd_fault_reset_switch

  # Restart ESP
  - platform: restart
    name: "Restart"

# ===== TEXT SENSORS (Status information) =====
text_sensor:
  # Operation Status
  - platform: template
    name: "Operation Status"
    id: operation_status
    icon: mdi:information
    update_interval: 2s
    lambda: |-
      if (id(is_running).state) {
        if (id(is_forward).state) return {"Running Forward"};
        if (id(is_reverse).state) return {"Running Reverse"};
        return {"Running"};
      } else if (id(is_jogging).state) {
        return {"Jogging"};
      } else if (id(is_stopped).state) {
        return {"Stopped"};
      }
      return {"Unknown"};

  # WiFi Info
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# ===== SELECT (Parameter configuration) =====
select:
  # Run Command Channel (P0.02)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Run Command Source"
    address: 0x0002  # P0.02
    value_type: U_WORD
    skip_updates: 60  # Only poll every 2 minutes (config parameter, rarely changes)
    optionsmap:
      "Panel": 0
      "Terminal": 1
      "Communication": 2

  # Frequency Source Selection (P0.03)
  - platform: modbus_controller
    modbus_controller_id: d12_vfd
    name: "Frequency Source"
    address: 0x0003  # P0.03
    value_type: U_WORD
    skip_updates: 60  # Only poll every 2 minutes (config parameter, rarely changes)
    optionsmap:
      "Panel Potentiometer": 0
      "Digital Reference 1": 1
      "Digital Reference 2": 2
      "Analog AVI (0-10V/0-20mA)": 3
      "Combination": 4
      "Analog ACI / Reserved": 5
      "Communication": 6
      "Pulse / Reserved": 7
      "MPPT (newer OCR)": 8

# ===== CONFIGURATION PARAMETERS =====
# You can add more parameter controls as needed:

