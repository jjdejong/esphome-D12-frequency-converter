<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Segoe UI,Helvetica,Arial,sans-serif">
<rect width="980" height="640" fill="#ffffff"/>
<text x="40" y="34" font-size="17" font-weight="700" fill="#1f2933">Câblage : carte ESPHome (D1 mini ↔ RS485) + pressostat de sécurité → D12</text>
<rect x="470" y="110" rx="8" width="210" height="410" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
<text x="575.0" y="128" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2933">Variateur D12</text>
<text x="575.0" y="148" font-size="10.5" text-anchor="middle" fill="#52606d">(alimenté en permanence)</text>
<rect x="465" y="170" width="10" height="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
<text x="480" y="179" font-size="11" font-weight="600" fill="#1f2933">A+</text>
